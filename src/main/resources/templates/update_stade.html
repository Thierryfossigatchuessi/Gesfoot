<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Stade Management System</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" 
              integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous" />
    </head>
    <body>
        <div class="container">
            <h1>Manage Stade</h1>
            <hr />
            <h2>Update Stade</h2>

            <form action="#" th:action="@{/stade/saveUpdate}" th:object="${stade}" method="POST">
                <input type="hidden" th:field="*{id}" />

                <!-- Nom -->
                <div class="mb-4 col-6">
                    <label th:for="nom">Nom</label>
                    <input type="text" th:field="*{nom}" placeholder="Nom du stade" class="form-control" />
                    <span class="text-danger" th:errors="*{nom}"></span>
                </div>

                <!-- Capacité -->
                <div class="mb-4 col-6">
                    <label th:for="capacite">Capacité</label>
                    <input type="number" th:field="*{capacite}" placeholder="Capacité du stade" class="form-control" />
                    <span class="text-danger" th:errors="*{capacite}"></span>
                </div>

                <!-- Ville -->
                <div class="mb-4 col-6">
                    <label th:for="ville">Ville</label>
                    <input type="text" th:field="*{ville}" placeholder="Ville" class="form-control" />
                    <span class="text-danger" th:errors="*{ville}"></span>
                </div>

                <!-- Pays -->
                <div class="mb-4 col-6">
                    <label th:for="pays">Pays</label>
                    <input type="text" th:field="*{pays}" placeholder="Pays" class="form-control" />
                    <span class="text-danger" th:errors="*{pays}"></span>
                </div>

                <!-- Boutons -->
                <div>
                    <button type="submit" class="btn btn-primary col-2">Mettre à jour</button>
                    <a th:href="@{/stade}" class="btn btn-danger col-2">Annuler</a>
                </div>
            </form>

            <hr />
        </div>
    </body>
</html>
