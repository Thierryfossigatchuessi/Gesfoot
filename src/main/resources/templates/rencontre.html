<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Rencontre List</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" 
              integrity="sha384
              KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" 
              crossorigin="anonymous"/>

    </head>
    <body>

        <div class="container my-2">
            <form th:action="@{/rencontre}" method="get">
                <div class="form-group">
                    <label>Mot-clé:</label>
                    <input type="text" name="motCle" placeholder="Nom du equipe" />
                    <button type="submit" class="btn btn-primary mt-2">Chercher</button>
                </div>
            </form>
        </div>

        <div class="container my-2">
            <form th:action="@{/fillter}" method="get">
                <div class="form-group">
                    <label for="motCle">Date de la rencontre :</label>
                    <input type="date" id="motCle" name="motCle" />
                    <button type="submit" class="btn btn-primary mt-2">Chercher</button>
                </div>
            </form>
        </div>


        <div class="container my-2" >
            <h1>Rencontre List</h1>
            <hr />
            <a th:href = "@{/rencontre/new}" class="btn btn-primary mt-2">Add Rencontre</a>
            <h2 class="mb-3">Rencontre List</h2>
            <table  class="table table-striped" >
                <thead>
                    <tr>
                        <th>id</th>
                        <th>Nom equipe 1</th> 
                        <th>Nom equipe 2</th>
                        <th>Stade</th>
                        <th>Date et Heure</th>
                        <th>Nom Arbitre</th>
                        <th>Score</th>

                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rencontre : ${listRencontre}">
                        <td th:text="${rencontre.id}"></td>
                        <td th:text="${rencontre.equipe1.nom}"></td>
                        <td th:text="${rencontre.equipe2.nom}"></td>
                        <td th:text="${rencontre.stade.nom}"></td>
                        <!--<td th:text="${rencontre.dateEtHeure, 'yyyy-MM-dd HH:mm'}"></td>-->
                        <td th:text="${#temporals.format(rencontre.dateEtHeure, ' dd MMM yyyy à HH:mm')}"></td>

                        <!-- <td th:text="${rencontre.dateEtHeure}"></td>-->
                        <td th:text="${rencontre.arbitre}"></td>
                        <td th:text="${rencontre.score}"></td>
                        <td><a th:href="@{/rencontre/update(id=${rencontre.id})}" class="btn btn-primary">Update</a>
                            <a th:href="@{/rencontre/delete(id=${rencontre.id})}" class="btn btn-danger">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${message}" th:text="${message}" class="alert-danger mb-3"/>
            <a th:href = "@{/}" class="btn btn-secondary mt-3">Back to Welcome Page</a>
        </div>
    </body>
</html>
