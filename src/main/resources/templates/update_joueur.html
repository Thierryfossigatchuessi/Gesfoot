<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title> update Player Management System</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" 
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous" />
    </head>
    
    <body>
        <div class="container">
            <h1>Manage Player</h1>
            <hr />
            <h2>Update player</h2>
            
            <form action="#" th:action="@{/joueur/saveUpdate}" th:object="${joueur}" method="POST">
                <div class="mb-4 col-4">
                    <input type="hidden" th:field="*{id}" class="form-control" />
                </div>
                <div class="mb-4 col-4">
                    <label th:for="nom">Nom</label>    
                    <input type="text" th:field="*{nom}" class="form-control" />
                    <span class="text-danger" th:errors="*{nom}"></span>
                </div>
                <div class="mb-4 col-4">
                    <label th:for="prenom">Prenom</label>    
                    <input type="text" th:field="*{prenom}" class="form-control" />
                    <span class="text-danger" th:errors="*{prenom}"></span>
                </div>
                <div class="mb-4 col-4">
                    <label th:for="dateNaissance">Date naissance</label>
                    <input type="date" th:field="*{dateNaissance}" class="form-control" />
                    <span class="text-danger" th:errors="*{dateNaissance}"></span>
                </div>
                <div class="mb-4 col-4">
                    <label th:for="poste">Poste</label>
                    <select th:field="*{poste}" class="form-control">
                        <option value="GARDIEN">GARDIEN</option>
                        <option value="DEFENSEUR">DEFENSEUR</option>
                        <option value="MILIEUX">MILIEUX</option>
                        <option value="ATTAQUANT">ATTAQUANT</option>
                    </select>
                    <span class="text-secondary" th:errors="*{poste}"></span>
                </div>
                <div class="mb-4 col-4">
                    <label th:for="numero">Numero</label>
                    <input type="number" th:field="*{numero}" class="form-control" />
                    <span class="text-dander" th:errors="*{numero}"></span>
                </div>
                
                <div class="mb-4 col-4">
    <label th:for="equipe">Equipe</label>
    <select th:field="*{equipe}" class="form-control">
        <option th:each="equipe : ${equipes}" th:value="${equipe.id}" th:text="${equipe.nom}"></option>
    </select>
    <span class="text-danger" th:errors="*{equipe}"></span>
</div>

                <div>
                    <button type="submit" class="btn btn-primary col-2">Save</button>
                    <a th:href = "@{/joueur}" class="btn btn-danger col-2">Cancel</a>
                </div>
            </form>
            
            <hr />
        </div>
    </body>
</html>
