<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Liste des Spectateurs</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" 
              integrity="sha384KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" 
              crossorigin="anonymous"/>
    </head>
    <body>
        <div class="container my-2">
            <h1>Liste des Spectateurs</h1>
            <hr />
            
            <!-- Lien pour ajouter un spectateur -->
          <a th:href="@{/spectateur/new}" class="btn btn-primary btn-sm mb-3">Ajouter un Spectateur</a>


            <!-- Formulaire de recherche -->
            <form action="/spectateurs/search" method="get" class="mb-3">
                <input type="text" name="search" placeholder="Rechercher par nom ou prénom" class="form-control" />
                <button type="submit" class="btn btn-primary mt-2">Rechercher</button>
            </form>
            
            <h2 class="mb-3">Liste des Spectateurs</h2>
            
            <!-- Tableau des spectateurs -->
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th> 
                        <th>Email</th>
                        <th>Billet</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="spectateur : ${listSpectateur}">

                        <td th:text="${spectateur.nom}"></td>
                        <td th:text="${spectateur.prenom}"></td>
                        <td th:text="${spectateur.email}"></td>
                        
                        <!-- Vérification de la présence d'un billet pour un spectateur -->
                        <td th:text="${spectateur.billets != null && !spectateur.billets.isEmpty() ? 'Billet disponible' : 'Aucun billet'}"></td>
                        
                        <td>
    <a th:href="@{/spectateurs/update/{id}(id=${spectateur.id})}" class="btn btn-primary">Modifier</a>
    
    <!-- Formulaire de suppression -->
    <form th:action="@{/spectateurs/delete}" method="POST" style="display:inline;" onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer ce spectateur?')">
        <input type="hidden" name="id" th:value="${spectateur.id}" />
        <button type="submit" class="btn btn-danger">Supprimer</button>
    </form>
</td>

                    </tr>
                </tbody>
            </table>
            
            <!-- Affichage du message si présent -->
            <div th:if="${message}" th:text="${message}" class="alert alert-danger mb-3"></div>
            
            <!-- Retour à la page d'accueil -->
            <a th:href="@{/}" class="btn btn-secondary mt-3">Retour à la page d'accueil</a>
        </div>
    </body>
</html>
